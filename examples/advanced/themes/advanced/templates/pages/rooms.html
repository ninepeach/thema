{{ template "components/header" . }}
<main>
    <section class="hero compact">
        <p class="eyebrow">{{ t "rooms.eyebrow" }}</p>
        <h1>{{ t "rooms.title" }}</h1>
        <p>{{ t "rooms.intro" }}</p>
    </section>
    <div class="room-grid">
        {{ range .Rooms }}
            {{ template "components/room-card" . }}
        {{ end }}
    </div>
</main>
{{ template "components/footer" . }}
