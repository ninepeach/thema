{{ template "components/header" . }}
<main>
    <section class="page-hero">
        <p class="eyebrow">{{ t "services.eyebrow" }}</p>
        <h1>{{ t "services.page_title" }}</h1>
        <p>{{ t "services.intro" }}</p>
    </section>
    <section class="service-grid wide">
        {{ range .Services }}
            {{ template "components/service-card" . }}
        {{ end }}
    </section>
    {{ template "components/cta" . }}
</main>
{{ template "components/footer" . }}
