<!doctype html>
<html lang="{{ .Locale }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ t .Page.Description }}">
    <title>{{ t .Page.Title }} · {{ .Site.Name }}</title>
    <link rel="stylesheet" href="{{ asset "css/app.css" }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">{{ .Site.Name }}</a>
        <nav aria-label="{{ t "nav.label" }}">
            <a href="/"{{ if eq .CurrentPath "/" }} aria-current="page"{{ end }}>{{ t "nav.home" }}</a>
            <a href="/services"{{ if eq .CurrentPath "/services" }} aria-current="page"{{ end }}>{{ t "nav.services" }}</a>
            <a href="/work"{{ if eq .CurrentPath "/work" }} aria-current="page"{{ end }}>{{ t "nav.work" }}</a>
            <a href="/about"{{ if eq .CurrentPath "/about" }} aria-current="page"{{ end }}>{{ t "nav.about" }}</a>
            <a href="/contact"{{ if eq .CurrentPath "/contact" }} aria-current="page"{{ end }}>{{ t "nav.contact" }}</a>
        </nav>
        <div class="languages" aria-label="{{ t "nav.language" }}">
            <a href="{{ .CurrentPath }}?lang=en"{{ if eq .Locale "en" }} aria-current="true"{{ end }}>EN</a>
            <a href="{{ .CurrentPath }}?lang=zh"{{ if eq .Locale "zh" }} aria-current="true"{{ end }}>中文</a>
        </div>
    </header>
